<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Redefinir senha | Conecta21</title><link rel="stylesheet" href="assets/css/styles.css"><link rel="stylesheet" href="assets/css/auth.css"></head>
<body class="auth-page"><main class="auth-container"><section class="auth-form-section"><div class="auth-form-container"><a class="auth-back" href="login.html">Voltar ao login</a><div class="auth-header"><h2>Redefina sua senha</h2><p>Escolha uma nova senha para acessar sua conta.</p></div>
<form id="accountForm"><div class="form-group"><label for="senha">Nova senha</label><input id="senha" type="password" autocomplete="new-password" required minlength="8"></div><div class="form-group"><label for="confirmacao">Confirmar senha</label><input id="confirmacao" type="password" autocomplete="new-password" required minlength="8"></div><div id="message" class="login-message" role="status"></div><button class="btn btn-primary auth-submit" type="submit">Salvar nova senha</button></form></div></section></main><script src="js/services/api.js"></script><script src="js/conta.js"></script></body></html>
