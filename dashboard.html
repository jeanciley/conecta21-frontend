<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Dashboard | Conecta21</title>

    <link rel="stylesheet" href="assets/css/styles.css">
    <link rel="stylesheet" href="assets/css/dashboard.css">

</head>


<body class="dashboard-page">


    <!-- =========================================
         MENU LATERAL
    ========================================== -->

    <aside class="sidebar">

        <div class="sidebar-logo">

            <span>Conecta</span><strong>21</strong>

        </div>


        <nav class="sidebar-menu">

            <a href="dashboard.html" class="menu-item active">
                Dashboard
            </a>

            <a href="equipe.html" class="menu-item">
                Equipe
            </a>

            <a href="chamado.html" class="menu-item">
                Chamados
            </a>

        </nav>


        <div class="sidebar-footer">

            <button id="btnLogout" class="logout-button">
                Sair
            </button>

        </div>

    </aside>



    <!-- =========================================
         CONTEÚDO PRINCIPAL
    ========================================== -->

    <main class="dashboard-main">


        <!-- Cabeçalho -->

        <header class="dashboard-header">

            <div>

                <h1>Dashboard</h1>

                <p>
                    Visão geral dos atendimentos do Conecta21.
                </p>

            </div>


            <div class="user-area">

                <span class="user-name">
                    Usuário
                </span>

            </div>

        </header>



        <!-- =========================================
             CARDS DE MÉTRICAS
        ========================================== -->

        <section class="metrics-grid">


            <div class="metric-card">

                <span class="metric-label">
                    Chamados abertos
                </span>

                <strong class="metric-value" id="chamadosAbertos">
                    0
                </strong>

            </div>


            <div class="metric-card">

                <span class="metric-label">
                    Em atendimento
                </span>

                <strong class="metric-value" id="chamadosAndamento">
                    0
                </strong>

            </div>


            <div class="metric-card">

                <span class="metric-label">
                    Resolvidos
                </span>

                <strong class="metric-value" id="chamadosResolvidos">
                    0
                </strong>

            </div>


            <div class="metric-card">

                <span class="metric-label">
                    Total de chamados
                </span>

                <strong class="metric-value" id="totalChamados">
                    0
                </strong>

            </div>


        </section>



        <!-- =========================================
             ÁREA DE CONTEÚDO
        ========================================== -->

        <section class="dashboard-content">


            <!-- =====================================
                 CHAMADOS RECENTES
            ====================================== -->

            <div class="dashboard-panel">

                <div class="panel-header">

                    <div>

                        <h2>Chamados recentes</h2>

                        <p>
                            Acompanhe os últimos atendimentos.
                        </p>

                    </div>

                </div>


                <div
                    id="listaChamadosRecentes"
                    class="recent-tickets"
                >

                    <!--
                        Os chamados serão inseridos
                        pelo dashboard.js.
                    -->

                </div>

            </div>



            <!-- =====================================
                 STATUS DOS CHAMADOS
            ====================================== -->

            <div class="dashboard-panel">

                <div class="panel-header">

                    <div>

                        <h2>Status dos chamados</h2>

                        <p>
                            Visão geral dos atendimentos.
                        </p>

                    </div>

                </div>


                <div
                    id="statusChamados"
                    class="status-list"
                >

                    <!--
                        Os status serão inseridos
                        pelo dashboard.js.
                    -->

                </div>

            </div>


        </section>


    </main>



    <!-- JavaScript -->

    <script src="js/auth.js"></script>
    <script src="js/dashboard.js"></script>

</body>

</html>
